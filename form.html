<!DOCTYPE html>
<html>
    <head>
        <title>student form</title>
    </head>
    <body>
        <h1> <b>registration  form</b></h1>
        <form action="register"method="post">
            <label for="FULL NAME">FULL NAME:</label>
            <input type="text " id="full name" name="full name" required>
            <br><label for="EMAIL">EMAIL</label>
            <input type="EMAIL" id="EMAIL" name="email">
            <br><label for="EMAIL ADDRESS"> EMAIL ADDRESS:</label>
            <input type="EMAIL ADDRESS" id="EMAIL ADDRESS" name="EMAIL ADDRESS">
            <br><label for="PASSWORD">PASSWORD</label>
            <input type="PASSWORD" id="PASSWORD" name="PASSWORD"><br>
            <label for="GENDER SELECTION">GENDER SELECTION</label>
            <input type="radio" id="MALE" name="MALE">
            <label for="MALE">MALE</label>
            <input type="radio" id="FEMALE" name="FEMALE">
            <label for="FEMALE">FEMALE</label>
            <input type="radio" id="OTHER" name="OTHER">
            <label for="OTHER">OTHER</label><br>
            <label for="COURSE">select your course:</label>
            <select id="COURSE" name="COURSE" required>
                <option value="">-- Choose a course--</option>
                <option value="BSC INFORMATION">BSC INFORMATION</option>
                <option value="TEACHING">MATH SCIENCE</option>  
                <option value="networking"> COMPUTER SCIENCE</option>
            </select>
            <br><button type="SUBMIT">SUBMIT</button>
        </form>
    </body>
</html>
